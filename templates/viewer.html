<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CS2 Demo Viewer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d12;
      --surface: #16161f;
      --surface2: #1e1e2e;
      --border: #2a2a3d;
      --ct: #38bdf8;
      --t: #fbbf24;
      --green: #4ade80;
      --red: #f87171;
      --muted: #6b7280;
      --text: #e2e8f0;
      --radius: 10px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 14px;
      min-height: 100vh;
    }

    /* ── Header ── */
    .site-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 28px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .site-header h1 { font-size: 1.15rem; font-weight: 700; letter-spacing: .04em; color: #fff; }
    .site-header span { color: var(--ct); }
    .back-btn {
      margin-left: auto;
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: .82rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color .15s, border-color .15s;
    }
    .back-btn:hover { color: var(--text); border-color: var(--text); }

    /* ── Match header ── */
    #results { max-width: 1100px; margin: 0 auto; padding: 24px 20px 60px; }

    .match-header {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px 28px;
      margin-bottom: 24px;
    }
    .match-score {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
      margin-bottom: 20px;
    }
    .team-block { text-align: center; min-width: 160px; }
    .team-name  { font-size: 1rem; font-weight: 700; margin-bottom: 4px; }
    .team-score { font-size: 3rem; font-weight: 800; line-height: 1; }
    .score-sep  { font-size: 2rem; color: var(--muted); font-weight: 300; }
    .ct-color   { color: var(--ct); }
    .t-color    { color: var(--t);  }

    .meta-pills { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    .pill {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 12px;
      font-size: .78rem;
      color: var(--muted);
    }
    .pill strong { color: var(--text); }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .tab-btn {
      background: none;
      border: none;
      padding: 9px 18px;
      color: var(--muted);
      font-size: .88rem;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color .15s;
    }
    .tab-btn:hover  { color: var(--text); }
    .tab-btn.active { color: var(--ct); border-bottom-color: var(--ct); }

    .tab-panel        { display: none; }
    .tab-panel.active { display: block; }

    /* ── Tables ── */
    .table-wrap { overflow-x: auto; border-radius: var(--radius); border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; }
    thead th {
      background: var(--surface2);
      padding: 10px 14px;
      text-align: left;
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
    }
    thead th.r { text-align: right; }
    tbody tr { border-top: 1px solid var(--border); transition: background .1s; }
    tbody tr:hover { background: var(--surface2); }
    td   { padding: 9px 14px; white-space: nowrap; }
    td.r { text-align: right; }

    /* ── Badges ── */
    .badge      { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: .72rem; font-weight: 700; }
    .badge-ct   { background: rgba(56,189,248,.15); color: var(--ct); }
    .badge-t    { background: rgba(251,191,36,.15);  color: var(--t);  }
    .badge-hs   { background: rgba(250,204,21,.15);  color: #facc15; }
    .badge-note { background: var(--surface2); color: var(--muted); font-size: .68rem; }

    .kd-good { color: var(--green); }
    .kd-bad  { color: var(--red);   }
    .kd-even { color: var(--text);  }

    /* ── Kill feed controls ── */
    .kill-controls {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
      align-items: center;
      flex-wrap: wrap;
    }
    .kill-controls input, .kill-controls select {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 7px 12px;
      font-size: .85rem;
    }
    .kill-controls input { flex: 1; min-width: 160px; }
    .kill-controls input::placeholder { color: var(--muted); }
    #kill-count { color: var(--muted); font-size: .82rem; margin-left: auto; }

    /* ── Round table accents ── */
    .ct-win td:first-child { border-left: 3px solid var(--ct); }
    .t-win  td:first-child { border-left: 3px solid var(--t);  }

    /* ── Round Timeline ── */
    .timeline-half       { margin-bottom: 20px; }
    .timeline-half-label {
      font-size: .72rem; font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 8px;
    }
    .timeline-row  { display: flex; flex-wrap: wrap; gap: 6px; }
    .round-block {
      width: 48px; height: 52px; border-radius: 7px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 3px; cursor: pointer; border: 2px solid transparent;
      transition: transform .12s, border-color .12s; position: relative;
    }
    .round-block:hover  { transform: translateY(-2px); }
    .round-block.active { border-color: #fff; }
    .round-block.ct     { background: rgba(56,189,248,.18); }
    .round-block.t      { background: rgba(251,191,36,.18); }
    .round-block.ct.active { background: rgba(56,189,248,.35); }
    .round-block.t.active  { background: rgba(251,191,36,.35); }
    .round-block .rnum  { font-size: .72rem; font-weight: 700; color: var(--muted); }
    .round-block .ricon { font-size: 1rem; line-height: 1; }
    .round-block .rscore { font-size: .65rem; font-weight: 700; }
    .round-block.ct .rscore { color: var(--ct); }
    .round-block.t  .rscore { color: var(--t);  }

    .round-block::after {
      content: attr(data-tip);
      position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
      background: var(--surface2); border: 1px solid var(--border); color: var(--text);
      font-size: .72rem; white-space: nowrap; padding: 4px 8px; border-radius: 5px;
      pointer-events: none; opacity: 0; transition: opacity .15s; z-index: 10;
    }
    .round-block:hover::after { opacity: 1; }

    #round-detail { margin-top: 18px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    #round-detail-header {
      padding: 10px 16px; background: var(--surface2);
      font-weight: 700; font-size: .88rem; display: flex; align-items: center; gap: 10px;
    }
    .round-kill-row {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 16px; border-top: 1px solid var(--border); font-size: .83rem;
    }
    .round-kill-row:hover { background: var(--surface2); }
    .rk-attacker { font-weight: 600; min-width: 130px; }
    .rk-arrow    { color: var(--muted); font-size: .75rem; }
    .rk-victim   { color: var(--red);   min-width: 130px; }
    .rk-weapon   { color: var(--green); min-width: 90px; font-size: .78rem; }
    .rk-badges   { display: flex; gap: 4px; }

    /* ── Map Viewer ── */
    #tab-map        { display: none; }
    #tab-map.active { display: grid; grid-template-columns: 1fr 200px; gap: 16px; }

    .map-canvas-wrap {
      position: relative; background: #0a0a10;
      border: 1px solid var(--border); border-radius: var(--radius);
      overflow: hidden; aspect-ratio: 1;
    }
    #map-canvas { width: 100%; height: 100%; display: block; }
    .map-no-data {
      position: absolute; inset: 0; display: flex; align-items: center;
      justify-content: center; color: var(--muted); font-size: .85rem;
      flex-direction: column; gap: 8px;
    }
    .map-sidebar  { display: flex; flex-direction: column; gap: 12px; }
    .map-controls {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; gap: 8px;
    }
    .map-controls label { font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
    .map-controls select {
      width: 100%; background: var(--surface2); border: 1px solid var(--border);
      color: var(--text); border-radius: 6px; padding: 6px 10px; font-size: .83rem;
    }
    .map-playback { display: flex; gap: 6px; align-items: center; }
    .map-btn {
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--text); border-radius: 6px; padding: 5px 10px;
      cursor: pointer; font-size: .85rem; transition: background .12s;
    }
    .map-btn:hover  { background: var(--border); }
    .map-btn.active { background: var(--ct); color: #000; border-color: var(--ct); }
    .map-scrubber   { width: 100%; accent-color: var(--ct); }
    .map-tick-label { font-size: .72rem; color: var(--muted); text-align: center; }

    .player-legend {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 10px 12px; flex: 1; overflow-y: auto;
    }
    .player-legend h4 {
      font-size: .72rem; text-transform: uppercase; letter-spacing: .07em;
      color: var(--muted); margin-bottom: 8px;
    }
    .legend-row {
      display: flex; align-items: center; gap: 8px; font-size: .8rem;
      border-radius: 4px; cursor: pointer; padding: 4px 6px; transition: background .1s;
    }
    .legend-row:hover { background: var(--surface2); }
    .legend-dot  { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .legend-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .legend-side { font-size: .7rem; color: var(--muted); }

    /* ── Map download btn ── */
    .dl-btn {
      display: inline-flex; align-items: center; gap: 6px;
      margin-top: 8px; padding: 8px 18px; background: var(--ct);
      color: #0d0d12; font-weight: 700; font-size: .8rem;
      border: none; border-radius: 6px; cursor: pointer; transition: opacity .15s;
    }
    .dl-btn:hover    { opacity: .85; }
    .dl-btn:disabled { opacity: .4; cursor: not-allowed; }
  </style>
</head>
<body>

<header class="site-header">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--ct)"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
  <h1>CS2 <span>Demo Viewer</span></h1>
  <a href="/" class="back-btn">&#8592; Load another demo</a>
</header>

<div id="results">

  <div class="match-header">
    <div class="match-score">
      <div class="team-block">
        <div class="team-name ct-color" id="ct-name">CT</div>
        <div class="team-score ct-color" id="ct-score">0</div>
      </div>
      <div class="score-sep">:</div>
      <div class="team-block">
        <div class="team-name t-color" id="t-name">T</div>
        <div class="team-score t-color" id="t-score">0</div>
      </div>
    </div>
    <div class="meta-pills" id="meta-pills"></div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('scoreboard', this)">Scoreboard</button>
    <button class="tab-btn" onclick="switchTab('timeline', this)">Timeline</button>
    <button class="tab-btn" onclick="switchTab('map', this)">Map</button>
    <button class="tab-btn" onclick="switchTab('rounds', this)">Rounds</button>
    <button class="tab-btn" onclick="switchTab('killfeed', this)">Kill Feed</button>
  </div>

  <!-- Scoreboard -->
  <div class="tab-panel active" id="tab-scoreboard">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Player</th><th>Team</th>
            <th class="r">K</th><th class="r">A</th><th class="r">D</th>
            <th class="r">K/D</th><th class="r">HS%</th><th class="r">DMG</th>
          </tr>
        </thead>
        <tbody id="scoreboard-body"></tbody>
      </table>
    </div>
  </div>

  <!-- Timeline -->
  <div class="tab-panel" id="tab-timeline">
    <div id="timeline-halves"></div>
    <div id="round-detail" style="display:none">
      <div id="round-detail-header"></div>
      <div id="round-detail-kills"></div>
    </div>
  </div>

  <!-- Map -->
  <div class="tab-panel" id="tab-map">
    <div class="map-canvas-wrap">
      <canvas id="map-canvas"></canvas>
      <div class="map-no-data" id="map-no-data">
        <span style="font-size:2rem" id="map-no-data-icon">🗺</span>
        <span id="map-no-data-msg">Select a round to view player positions</span>
        <button class="dl-btn" id="map-download-btn" onclick="downloadMaps()" style="display:none">
          Download Map Images (~100 MB)
        </button>
      </div>
    </div>
    <div class="map-sidebar">
      <div class="map-controls">
        <label>Round</label>
        <select id="map-round-sel" onchange="mapLoadRound(this.value)">
          <option value="">— select —</option>
        </select>
        <label style="margin-top:4px">Playback</label>
        <div class="map-playback">
          <button class="map-btn" id="map-play-btn" onclick="mapTogglePlay()">▶ Play</button>
          <select id="map-speed-sel" onchange="mapSetSpeed(this.value)"
            style="flex:1;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:5px 8px;font-size:.8rem">
            <option value="0.5">0.5×</option>
            <option value="1" selected>1×</option>
            <option value="2">2×</option>
            <option value="4">4×</option>
          </select>
        </div>
        <input type="range" class="map-scrubber" id="map-scrubber" min="0" value="0" oninput="mapScrub(this.value)" />
        <div class="map-tick-label" id="map-tick-label">—</div>
      </div>
      <div class="player-legend">
        <h4>Players</h4>
        <div id="player-legend-body"></div>
      </div>
    </div>
  </div>

  <!-- Rounds -->
  <div class="tab-panel" id="tab-rounds">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th><th>Winner</th><th>Reason</th>
            <th class="r">CT Score</th><th class="r">T Score</th>
          </tr>
        </thead>
        <tbody id="rounds-body"></tbody>
      </table>
    </div>
  </div>

  <!-- Kill Feed -->
  <div class="tab-panel" id="tab-killfeed">
    <div class="kill-controls">
      <input type="text" id="kill-search" placeholder="Search player or weapon…" oninput="filterKills()" />
      <select id="kill-round" onchange="filterKills()">
        <option value="">All rounds</option>
      </select>
      <span id="kill-count"></span>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Tick</th><th>Rnd</th>
            <th>Attacker</th><th></th><th>Victim</th>
            <th>Weapon</th><th>Notes</th>
          </tr>
        </thead>
        <tbody id="kills-body"></tbody>
      </table>
    </div>
  </div>

</div><!-- /results -->

<script>
  // ── Bootstrap: load data from sessionStorage ────────────────
  const _raw = sessionStorage.getItem('demoData');
  if (!_raw) { window.location.href = '/'; }
  const demoData = JSON.parse(_raw);

  // ── State ────────────────────────────────────────────────────
  let allKills   = [];
  let allRounds  = [];
  let selectedRound = null;

  // ── Render ───────────────────────────────────────────────────
  function renderResults(d) {
    document.getElementById('ct-name').textContent  = d.ct_team;
    document.getElementById('t-name').textContent   = d.t_team;
    document.getElementById('ct-score').textContent = d.ct_wins;
    document.getElementById('t-score').textContent  = d.t_wins;

    const h = d.header;
    document.getElementById('meta-pills').innerHTML = [
      ['File', d.filename], ['Map', h.map],
      ['Tickrate', h.tickrate + ' Hz'], ['Duration', h.duration], ['Rounds', d.total_rounds],
    ].map(([k, v]) => `<div class="pill"><strong>${k}:</strong> ${v}</div>`).join('');

    // Scoreboard
    document.getElementById('scoreboard-body').innerHTML = d.scoreboard.map(p => {
      const ct        = p.team.toUpperCase().includes('CT');
      const badgeClass = ct ? 'badge-ct' : 'badge-t';
      const kdClass   = p.kd >= 1.1 ? 'kd-good' : p.kd < 0.9 ? 'kd-bad' : 'kd-even';
      return `<tr>
        <td><strong>${esc(p.name)}</strong></td>
        <td><span class="badge ${badgeClass}">${esc(p.team)}</span></td>
        <td class="r">${p.kills}</td>
        <td class="r">${p.assists}</td>
        <td class="r">${p.deaths}</td>
        <td class="r ${kdClass}">${p.kd.toFixed(2)}</td>
        <td class="r">${p.hs_pct}%</td>
        <td class="r">${p.dmg.toLocaleString()}</td>
      </tr>`;
    }).join('');

    // Rounds table
    document.getElementById('rounds-body').innerHTML = d.rounds.map(r => {
      const ct       = r.winner_side.toUpperCase().includes('CT');
      const winBadge = ct
        ? `<span class="badge badge-ct">CT Win</span>`
        : `<span class="badge badge-t">T Win</span>`;
      return `<tr class="${ct ? 'ct-win' : 't-win'}">
        <td>${r.round_num}</td>
        <td>${winBadge}</td>
        <td>${esc(r.reason)}</td>
        <td class="r ct-color">${r.ct_score}</td>
        <td class="r t-color">${r.t_score}</td>
      </tr>`;
    }).join('');

    // Timeline + map init
    allRounds = d.rounds;
    renderTimeline(d.rounds, d.ct_team, d.t_team);
    try { mapInit(d); } catch(e) { console.error('mapInit failed:', e); }

    // Kill feed
    allKills = d.kills;
    const roundSel    = document.getElementById('kill-round');
    const uniqueRounds = [...new Set(d.kills.map(k => k.round_num))].sort((a, b) => a - b);
    roundSel.innerHTML = '<option value="">All rounds</option>' +
      uniqueRounds.map(r => `<option value="${r}">Round ${r}</option>`).join('');
    filterKills();
  }

  function filterKills() {
    const q   = document.getElementById('kill-search').value.toLowerCase();
    const rnd = document.getElementById('kill-round').value;
    const filtered = allKills.filter(k => {
      const matchText  = !q ||
        k.attacker.toLowerCase().includes(q) ||
        k.victim.toLowerCase().includes(q)   ||
        k.weapon.toLowerCase().includes(q);
      const matchRound = !rnd || String(k.round_num) === rnd;
      return matchText && matchRound;
    });

    document.getElementById('kill-count').textContent = `${filtered.length} kills`;
    document.getElementById('kills-body').innerHTML = filtered.map(k => {
      const notes  = [
        k.through_smoke ? '<span class="badge badge-note">smoke</span>'    : '',
        k.no_scope      ? '<span class="badge badge-note">no-scope</span>' : '',
        k.penetrated    ? '<span class="badge badge-note">wall</span>'     : '',
      ].filter(Boolean).join(' ');
      const hsTag   = k.headshot ? '<span class="badge badge-hs">HS</span>' : '';
      const attCt   = k.attacker_team.toUpperCase().includes('CT');
      const attClass = attCt ? 'ct-color' : 't-color';
      return `<tr>
        <td style="color:var(--muted)">${k.tick}</td>
        <td style="color:var(--muted)">${k.round_num}</td>
        <td class="${attClass}"><strong>${esc(k.attacker)}</strong></td>
        <td>${hsTag}</td>
        <td style="color:var(--red)">${esc(k.victim)}</td>
        <td style="color:var(--green)">${esc(k.weapon)}</td>
        <td>${notes}</td>
      </tr>`;
    }).join('');
  }

  // ── Tabs ─────────────────────────────────────────────────────
  function switchTab(name, btn) {
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-' + name).classList.add('active');
    btn.classList.add('active');
  }

  // ── Timeline ─────────────────────────────────────────────────
  const REASON_ICON = {
    'Bomb Defused': '🔵', 'Bomb Exploded': '💥', 'Target Bombed': '💥',
    'Ct Win': '🛡', 'Counter Terrorists Win': '🛡',
    'T Win': '💣', 'Terrorists Win': '💣', 'Target Saved': '⏱',
  };

  function reasonIcon(reason) {
    for (const [k, v] of Object.entries(REASON_ICON))
      if (reason.toLowerCase().includes(k.toLowerCase())) return v;
    return '🎯';
  }

  function renderTimeline(rounds, ctTeam, tTeam) {
    const container = document.getElementById('timeline-halves');
    container.innerHTML = '';
    const halves = [];
    rounds.forEach(r => {
      let hi = r.round_num <= 12 ? 0 : r.round_num <= 24 ? 1 : 2 + Math.floor((r.round_num - 25) / 6);
      if (!halves[hi]) halves[hi] = [];
      halves[hi].push(r);
    });
    const halfLabels = ['1st Half', '2nd Half'];
    halves.forEach((group, idx) => {
      if (!group) return;
      const label = halfLabels[idx] || `Overtime ${idx - 1}`;
      const ctW = group.filter(r => r.winner_side === 'CT').length;
      const tW  = group.length - ctW;
      const halfDiv = document.createElement('div');
      halfDiv.className = 'timeline-half';
      halfDiv.innerHTML = `<div class="timeline-half-label">${label} &nbsp;
        <span style="color:var(--ct)">${ctTeam} ${ctW}</span>
        <span style="color:var(--muted)"> – </span>
        <span style="color:var(--t)">${tW} ${tTeam}</span></div>`;
      const row = document.createElement('div');
      row.className = 'timeline-row';
      group.forEach(r => {
        const isCt = r.winner_side === 'CT';
        const block = document.createElement('div');
        block.className   = `round-block ${isCt ? 'ct' : 't'}`;
        block.dataset.tip = r.reason;
        block.innerHTML   = `<span class="rnum">${r.round_num}</span>
          <span class="ricon">${reasonIcon(r.reason)}</span>
          <span class="rscore">${r.ct_score}:${r.t_score}</span>`;
        block.addEventListener('click', () => selectRound(r.round_num, block));
        row.appendChild(block);
      });
      halfDiv.appendChild(row);
      container.appendChild(halfDiv);
    });
  }

  function selectRound(roundNum, blockEl) {
    if (selectedRound === roundNum) {
      selectedRound = null;
      document.querySelectorAll('.round-block').forEach(b => b.classList.remove('active'));
      document.getElementById('round-detail').style.display = 'none';
      return;
    }
    selectedRound = roundNum;
    document.querySelectorAll('.round-block').forEach(b => b.classList.remove('active'));
    blockEl.classList.add('active');

    const round    = allRounds.find(r => r.round_num === roundNum);
    const kills    = allKills.filter(k => k.round_num === roundNum);
    const isCt     = round.winner_side === 'CT';
    const winColor = isCt ? 'var(--ct)' : 'var(--t)';

    document.getElementById('round-detail-header').innerHTML = `
      <span style="color:${winColor};font-size:1.1rem">${reasonIcon(round.reason)}</span>
      <span>Round ${round.round_num}</span>
      <span class="badge ${isCt ? 'badge-ct' : 'badge-t'}">${round.winner_side} Win</span>
      <span style="color:var(--muted);font-weight:400">${esc(round.reason)}</span>
      <span style="margin-left:auto;color:var(--muted);font-weight:400;font-size:.8rem">${kills.length} kills</span>`;

    document.getElementById('round-detail-kills').innerHTML = kills.length === 0
      ? `<div class="round-kill-row" style="color:var(--muted)">No kill data for this round.</div>`
      : kills.map(k => {
          const badges = [
            k.headshot      ? '<span class="badge badge-hs">HS</span>'         : '',
            k.through_smoke ? '<span class="badge badge-note">smoke</span>'    : '',
            k.no_scope      ? '<span class="badge badge-note">no-scope</span>' : '',
            k.penetrated    ? '<span class="badge badge-note">wall</span>'     : '',
          ].filter(Boolean).join('');
          return `<div class="round-kill-row">
            <span class="rk-attacker ct-color">${esc(k.attacker)}</span>
            <span class="rk-arrow">›</span>
            <span class="rk-weapon">${esc(k.weapon)}</span>
            <span class="rk-arrow">›</span>
            <span class="rk-victim">${esc(k.victim)}</span>
            <span class="rk-badges">${badges}</span>
          </div>`;
        }).join('');

    const detail = document.getElementById('round-detail');
    detail.style.display = 'block';
    detail.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  // ── Map viewer ───────────────────────────────────────────────
  const PLAYER_COLORS = [
    '#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#c77dff',
    '#ff9f1c','#2ec4b6','#f72585','#80b918','#adb5bd'
  ];
  const TRAIL_LEN = 12;

  let mapSession    = null;
  let mapName       = null;
  let mapBounds     = null;
  let mapImage      = null;
  let mapFrames     = [];
  let mapFrame      = 0;
  let mapPlaying    = false;
  let mapSpeed      = 1;
  let mapTimer      = null;
  let playerColorMap = {};
  let playerIndexMap = {};
  let hiddenPlayers  = new Set();

  function checkMapsReady(onReady) {
    fetch('/api/maps_ready')
      .then(r => r.json())
      .then(d => {
        if (d.ready) { onReady(); }
        else {
          document.getElementById('map-no-data-icon').textContent = '⬇️';
          document.getElementById('map-no-data-msg').textContent  = 'Map radar images not downloaded yet.';
          document.getElementById('map-download-btn').style.display = '';
          document.getElementById('map-no-data').style.display    = 'flex';
        }
      })
      .catch(() => onReady());
  }

  function downloadMaps() {
    const btn = document.getElementById('map-download-btn');
    btn.disabled = true;
    btn.textContent = 'Downloading…';
    document.getElementById('map-no-data-icon').textContent = '⏳';
    document.getElementById('map-no-data-msg').textContent  = 'Downloading map images, please wait…';
    fetch('/api/download_maps', { method: 'POST' })
      .then(r => r.json())
      .then(d => {
        if (d.error) {
          document.getElementById('map-no-data-msg').textContent = 'Download failed: ' + d.error;
          btn.textContent = 'Retry'; btn.disabled = false;
        } else {
          btn.style.display = 'none';
          document.getElementById('map-no-data-icon').textContent = '✅';
          document.getElementById('map-no-data-msg').textContent  = 'Maps downloaded! Select a round to begin.';
          if (mapName) {
            const img = new Image();
            img.onload  = () => { mapImage = img; mapRedraw(); };
            img.onerror = () => { mapImage = null; };
            img.src = `/api/map_image/${encodeURIComponent(mapName)}?t=${Date.now()}`;
          }
        }
      })
      .catch(() => {
        document.getElementById('map-no-data-msg').textContent = 'Network error during download.';
        btn.textContent = 'Retry'; btn.disabled = false;
      });
  }

  function mapInit(data) {
    mapSession = data.session_id;
    mapName    = data.header.map;

    document.getElementById('map-round-sel').innerHTML =
      '<option value="">— select —</option>' +
      data.rounds.map(r => `<option value="${r.round_num}">Round ${r.round_num} — ${r.reason}</option>`).join('');

    playerColorMap = {};
    playerIndexMap = {};
    data.scoreboard.forEach((p, i) => { playerColorMap[p.name] = PLAYER_COLORS[i % PLAYER_COLORS.length]; });

    document.getElementById('player-legend-body').innerHTML = data.scoreboard.map((p, i) => {
      playerIndexMap[p.name] = i;
      const color = playerColorMap[p.name];
      const isCt  = p.team.toUpperCase().includes('CT');
      return `<div class="legend-row" onclick="mapTogglePlayer('${esc(p.name)}')" id="leg-${i}">
        <span class="legend-dot" style="background:${color}"></span>
        <span class="legend-name" title="${esc(p.name)}">${esc(p.name)}</span>
        <span class="legend-side">${isCt ? '🔵CT' : '🟡T'}</span>
      </div>`;
    }).join('');

    fetch(`/api/map_info/${encodeURIComponent(mapName)}`)
      .then(r => r.json()).then(b => { mapBounds = b; });

    document.getElementById('map-download-btn').style.display = 'none';
    checkMapsReady(() => {
      const img = new Image();
      img.onload  = () => { mapImage = img; mapRedraw(); };
      img.onerror = () => { mapImage = null; };
      img.src = `/api/map_image/${encodeURIComponent(mapName)}`;
    });

    document.getElementById('map-no-data-msg').textContent = data.has_ticks
      ? 'Select a round to view player positions'
      : 'Position data not available in this demo';
  }

  function mapTogglePlayer(name) {
    if (hiddenPlayers.has(name)) hiddenPlayers.delete(name);
    else hiddenPlayers.add(name);
    const idx = playerIndexMap[name];
    if (idx !== undefined) {
      const el = document.getElementById('leg-' + idx);
      if (el) el.style.opacity = hiddenPlayers.has(name) ? '0.3' : '1';
    }
    mapRedraw();
  }

  function mapLoadRound(roundNum) {
    if (!roundNum || !mapSession) return;
    mapStop();
    mapFrames = []; mapFrame = 0;
    document.getElementById('map-no-data').style.display = 'flex';
    document.getElementById('map-no-data-msg').textContent = 'Loading…';

    fetch(`/api/ticks/${mapSession}/${roundNum}`)
      .then(r => r.json())
      .then(d => {
        if (d.error) { document.getElementById('map-no-data-msg').textContent = d.error; return; }
        mapFrames = d.frames;
        if (!mapFrames.length) { document.getElementById('map-no-data-msg').textContent = 'No position data for this round'; return; }
        document.getElementById('map-no-data').style.display = 'none';
        const scrubber = document.getElementById('map-scrubber');
        scrubber.max = mapFrames.length - 1; scrubber.value = 0;
        mapFrame = 0; mapRedraw();
      });
  }

  function mapTogglePlay() { mapPlaying ? mapStop() : mapPlay(); }

  function mapPlay() {
    if (!mapFrames.length) return;
    mapPlaying = true;
    document.getElementById('map-play-btn').textContent = '⏸ Pause';
    document.getElementById('map-play-btn').classList.add('active');
    mapTimer = setInterval(() => {
      mapFrame++;
      if (mapFrame >= mapFrames.length) { mapStop(); mapFrame = mapFrames.length - 1; }
      document.getElementById('map-scrubber').value = mapFrame;
      mapRedraw();
    }, Math.max(16, Math.round(100 / mapSpeed)));
  }

  function mapStop() {
    mapPlaying = false; clearInterval(mapTimer);
    document.getElementById('map-play-btn').textContent = '▶ Play';
    document.getElementById('map-play-btn').classList.remove('active');
  }

  function mapSetSpeed(v) { mapSpeed = parseFloat(v); if (mapPlaying) { mapStop(); mapPlay(); } }
  function mapScrub(v)    { mapFrame = parseInt(v); if (mapPlaying) mapStop(); mapRedraw(); }

  function worldToCanvas(wx, wy, bounds, size) {
    return {
      x: ((wx - bounds.pos_x) / bounds.scale / 1024) * size,
      y: ((bounds.pos_y - wy) / bounds.scale / 1024) * size,
    };
  }

  function mapRedraw() {
    const canvas = document.getElementById('map-canvas');
    const size   = canvas.parentElement.clientWidth || 560;
    canvas.width = canvas.height = size;
    const ctx = canvas.getContext('2d');

    ctx.fillStyle = '#0a0a10';
    ctx.fillRect(0, 0, size, size);
    if (mapImage) { ctx.globalAlpha = 0.55; ctx.drawImage(mapImage, 0, 0, size, size); ctx.globalAlpha = 1; }
    if (!mapFrames.length || !mapBounds) return;

    const frame = mapFrames[mapFrame];
    if (!frame) return;

    // Trails
    const trails = {};
    for (let fi = Math.max(0, mapFrame - TRAIL_LEN); fi <= mapFrame; fi++) {
      const f = mapFrames[fi]; if (!f) continue;
      f.p.forEach(pl => { if (!trails[pl.n]) trails[pl.n] = []; trails[pl.n].push({ ...pl, fi }); });
    }
    Object.entries(trails).forEach(([name, pts]) => {
      if (hiddenPlayers.has(name)) return;
      const color = playerColorMap[name] || '#fff';
      for (let i = 1; i < pts.length; i++) {
        if (!pts[i-1].alive || !pts[i].alive) continue;
        const ca = worldToCanvas(pts[i-1].x, pts[i-1].y, mapBounds, size);
        const cb = worldToCanvas(pts[i].x,   pts[i].y,   mapBounds, size);
        ctx.beginPath();
        ctx.strokeStyle = color;
        ctx.globalAlpha = 0.12 + 0.55 * (i / pts.length);
        ctx.lineWidth   = 1.5;
        ctx.moveTo(ca.x, ca.y); ctx.lineTo(cb.x, cb.y); ctx.stroke();
      }
    });
    ctx.globalAlpha = 1;

    // Players
    frame.p.forEach(pl => {
      if (hiddenPlayers.has(pl.n)) return;
      const color = playerColorMap[pl.n] || '#fff';
      const pos   = worldToCanvas(pl.x, pl.y, mapBounds, size);
      const r     = 7;

      if (!pl.alive) {
        ctx.strokeStyle = color; ctx.globalAlpha = 0.35; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(pos.x-4, pos.y-4); ctx.lineTo(pos.x+4, pos.y+4); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(pos.x+4, pos.y-4); ctx.lineTo(pos.x-4, pos.y+4); ctx.stroke();
        ctx.globalAlpha = 1; return;
      }

      // HP arc
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, r+2, -Math.PI/2, -Math.PI/2 + 2*Math.PI * Math.min(1, (pl.hp||0)/100));
      ctx.strokeStyle = color; ctx.lineWidth = 2.5; ctx.globalAlpha = 0.7; ctx.stroke();

      // Dot
      ctx.beginPath(); ctx.arc(pos.x, pos.y, r, 0, Math.PI*2);
      ctx.fillStyle = color; ctx.globalAlpha = 0.9; ctx.fill();

      // Side ring
      ctx.beginPath(); ctx.arc(pos.x, pos.y, r, 0, Math.PI*2);
      ctx.strokeStyle = (pl.side||'').toUpperCase().includes('CT') ? '#38bdf8' : '#fbbf24';
      ctx.lineWidth = 1.5; ctx.globalAlpha = 1; ctx.stroke();

      // Name
      ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center';
      ctx.fillStyle = '#fff'; ctx.globalAlpha = 0.9;
      ctx.fillText(pl.n.split(' ')[0].substring(0, 8), pos.x, pos.y - r - 3);
      ctx.globalAlpha = 1;
    });

    document.getElementById('map-tick-label').textContent =
      `Frame ${mapFrame+1} / ${mapFrames.length}  •  Tick ${frame.t}`;
  }

  // ── Helpers ──────────────────────────────────────────────────
  function esc(str) {
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  renderResults(demoData);
</script>
</body>
</html>
