<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CS2 Demo Viewer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d12;
      --surface: #16161f;
      --surface2: #1e1e2e;
      --border: #2a2a3d;
      --ct: #38bdf8;
      --red: #f87171;
      --muted: #6b7280;
      --text: #e2e8f0;
      --radius: 10px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 14px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .site-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 28px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .site-header h1 { font-size: 1.15rem; font-weight: 700; letter-spacing: .04em; color: #fff; }
    .site-header span { color: var(--ct); }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    #upload-zone {
      width: 100%;
      max-width: 520px;
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 64px 32px;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
    }
    #upload-zone:hover, #upload-zone.drag-over {
      border-color: var(--ct);
      background: rgba(56,189,248,.05);
    }
    #upload-zone .icon { font-size: 3rem; margin-bottom: 14px; }
    #upload-zone p { color: var(--muted); margin-top: 8px; font-size: .88rem; }
    #upload-zone strong { color: var(--text); font-size: 1.05rem; }
    #file-input { display: none; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 20px;
      padding: 10px 26px;
      background: var(--ct);
      color: #0d0d12;
      font-weight: 700;
      font-size: .88rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: opacity .15s;
    }
    .btn:hover { opacity: .85; }
    .btn:disabled { opacity: .4; cursor: not-allowed; }

    #progress-wrap {
      display: none;
      width: 100%;
      max-width: 520px;
      text-align: center;
    }
    #progress-wrap p { margin-bottom: 12px; color: var(--muted); font-size: .9rem; }
    .progress-bar-bg { height: 6px; background: var(--border); border-radius: 99px; overflow: hidden; }
    .progress-bar-fill {
      height: 100%;
      background: var(--ct);
      width: 0%;
      transition: width .3s;
      animation: indeterminate 1.4s infinite;
    }
    @keyframes indeterminate {
      0%   { transform: translateX(-100%) scaleX(.5); }
      100% { transform: translateX(200%) scaleX(.5); }
    }

    #error-banner {
      display: none;
      width: 100%;
      max-width: 520px;
      margin-top: 16px;
      background: rgba(248,113,113,.1);
      border: 1px solid var(--red);
      color: var(--red);
      border-radius: var(--radius);
      padding: 12px 18px;
      font-size: .88rem;
    }
  </style>
</head>
<body>

<header class="site-header">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--ct)"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
  <h1>CS2 <span>Demo Viewer</span></h1>
</header>

<main>
  <div id="upload-zone">
    <div class="icon">🎮</div>
    <strong>Drop your .dem file here</strong>
    <p>or click the button below to browse</p>
    <button class="btn" onclick="document.getElementById('file-input').click()">Choose File</button>
    <input type="file" id="file-input" accept=".dem" />
  </div>

  <div id="progress-wrap">
    <p id="progress-label">Uploading…</p>
    <div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-fill"></div></div>
  </div>

  <div id="error-banner"></div>
</main>

<script>
  const zone      = document.getElementById('upload-zone');
  const fileInput = document.getElementById('file-input');

  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
  zone.addEventListener('drop', e => {
    e.preventDefault();
    zone.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file) uploadFile(file);
  });
  zone.addEventListener('click', e => { if (e.target.tagName !== 'BUTTON') fileInput.click(); });
  fileInput.addEventListener('change', () => { if (fileInput.files[0]) uploadFile(fileInput.files[0]); });

  function uploadFile(file) {
    if (!file.name.toLowerCase().endsWith('.dem')) {
      showError('Only .dem files are supported.');
      return;
    }
    hideError();
    zone.style.display = 'none';

    const progressWrap  = document.getElementById('progress-wrap');
    const progressLabel = document.getElementById('progress-label');
    progressWrap.style.display = 'block';
    progressLabel.textContent  = `Uploading ${file.name}…`;

    const fd  = new FormData();
    fd.append('demo', file);

    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/parse');

    xhr.upload.onprogress = e => {
      if (e.lengthComputable) {
        const pct  = Math.round(e.loaded / e.total * 100);
        const fill = document.getElementById('progress-fill');
        fill.style.animation = 'none';
        fill.style.width     = pct + '%';
        progressLabel.textContent = `Uploading… ${pct}%`;
      }
    };

    xhr.onload = () => {
      if (xhr.status === 200) {
        progressLabel.textContent = 'Parsing complete — loading viewer…';
        const data = JSON.parse(xhr.responseText);
        sessionStorage.setItem('demoData', JSON.stringify(data));
        window.location.href = '/viewer';
      } else {
        progressWrap.style.display = 'none';
        zone.style.display = '';
        let msg = 'Server error';
        try { msg = JSON.parse(xhr.responseText).error || msg; } catch {}
        showError(msg);
      }
    };

    xhr.onerror = () => {
      progressWrap.style.display = 'none';
      zone.style.display = '';
      showError('Network error — is the server running?');
    };

    progressLabel.textContent = `Parsing ${file.name} — this may take a moment…`;
    xhr.send(fd);
  }

  function showError(msg) {
    const el = document.getElementById('error-banner');
    el.textContent = '⚠ ' + msg;
    el.style.display = 'block';
  }
  function hideError() {
    document.getElementById('error-banner').style.display = 'none';
  }
</script>
</body>
</html>
