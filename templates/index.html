<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CS2 Demo Viewer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d12;
      --surface: #16161f;
      --surface2: #1e1e2e;
      --border: #2a2a3d;
      --ct: #38bdf8;
      --red: #f87171;
      --green: #4ade80;
      --muted: #6b7280;
      --text: #e2e8f0;
      --radius: 10px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 14px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .site-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 28px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .site-header h1 { font-size: 1.15rem; font-weight: 700; letter-spacing: .04em; color: #fff; }
    .site-header span { color: var(--ct); }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    /* ── Upload zone ── */
    #upload-zone {
      width: 100%;
      max-width: 520px;
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 56px 32px;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
    }
    #upload-zone:hover, #upload-zone.drag-over {
      border-color: var(--ct);
      background: rgba(56,189,248,.05);
    }
    #upload-zone .icon { font-size: 3rem; margin-bottom: 14px; }
    #upload-zone p { color: var(--muted); margin-top: 8px; font-size: .88rem; }
    #upload-zone strong { color: var(--text); font-size: 1.05rem; }
    #file-input { display: none; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 20px;
      padding: 10px 26px;
      background: var(--ct);
      color: #0d0d12;
      font-weight: 700;
      font-size: .88rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: opacity .15s;
    }
    .btn:hover { opacity: .85; }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn-ghost {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .btn-ghost:hover { opacity: 1; border-color: var(--muted); color: var(--text); }

    /* ── Queue ── */
    #queue-wrap {
      display: none;
      width: 100%;
      max-width: 520px;
    }
    #queue-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    #queue-header span {
      font-size: .78rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .07em;
      font-weight: 700;
    }
    #queue-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }
    .qi {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 14px;
      transition: border-color .2s;
    }
    .qi.uploading { border-color: var(--ct); }
    .qi.done      { border-color: var(--green); }
    .qi.error     { border-color: var(--red); }
    .qi-icon  { font-size: 1rem; flex-shrink: 0; width: 20px; text-align: center; }
    .qi-name  { flex: 1; font-size: .85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .qi-status {
      font-size: .75rem;
      white-space: nowrap;
      color: var(--muted);
    }
    .qi.uploading .qi-status { color: var(--ct); }
    .qi.done      .qi-status { color: var(--green); }
    .qi.error     .qi-status { color: var(--red); }

    .qi-progress {
      width: 100%;
      height: 3px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
      margin-top: 5px;
      display: none;
    }
    .qi.uploading .qi-progress { display: block; }
    .qi-progress-fill {
      height: 100%;
      background: var(--ct);
      width: 0%;
      transition: width .2s;
      animation: indeterminate 1.4s infinite;
    }
    @keyframes indeterminate {
      0%   { transform: translateX(-100%) scaleX(.5); }
      100% { transform: translateX(200%) scaleX(.5); }
    }

    #queue-summary {
      text-align: center;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding-top: 4px;
    }
    #queue-summary p { color: var(--muted); font-size: .88rem; }

    /* ── Single-file progress (1 file) ── */
    #progress-wrap {
      display: none;
      width: 100%;
      max-width: 520px;
      text-align: center;
    }
    #progress-wrap p { margin-bottom: 12px; color: var(--muted); font-size: .9rem; }
    .progress-bar-bg { height: 6px; background: var(--border); border-radius: 99px; overflow: hidden; }
    .progress-bar-fill {
      height: 100%;
      background: var(--ct);
      width: 0%;
      transition: width .3s;
      animation: indeterminate 1.4s infinite;
    }

    /* ── Error ── */
    #error-banner {
      display: none;
      width: 100%;
      max-width: 520px;
      margin-top: 16px;
      background: rgba(248,113,113,.1);
      border: 1px solid var(--red);
      color: var(--red);
      border-radius: var(--radius);
      padding: 12px 18px;
      font-size: .88rem;
    }

    /* ── Demo History ── */
    #history-section { width: 100%; max-width: 520px; margin-top: 40px; }
    #history-section h2 {
      font-size: .8rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .08em; color: var(--muted); margin-bottom: 12px;
    }
    #history-list { display: flex; flex-direction: column; gap: 8px; }
    .demo-row {
      display: flex; align-items: center; gap: 10px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 10px 14px;
      cursor: pointer; transition: border-color .15s, background .15s;
    }
    .demo-row:hover { border-color: var(--ct); background: var(--surface2); }
    .demo-name {
      flex: 1; font-weight: 600; font-size: .88rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .demo-meta { font-size: .75rem; color: var(--muted); white-space: nowrap; }
    .demo-del {
      background: none; border: none; color: var(--muted);
      cursor: pointer; font-size: .9rem; padding: 2px 5px;
      border-radius: 4px; transition: color .15s; line-height: 1;
    }
    .demo-del:hover { color: var(--red); }
    #history-empty { color: var(--muted); font-size: .85rem; display: none; }
  </style>
</head>
<body>

<header class="site-header">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--ct)"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
  <h1>CS2 <span>Demo Viewer</span></h1>
  <a href="/admin" class="btn btn-ghost" style="margin-left:auto" title="Admin">SQL-Admin</a>
</header>

<main>
  <div id="upload-zone">
    <div class="icon">🎮</div>
    <strong>Drop .dem files here</strong>
    <p>Single file opens the viewer · Multiple files are queued and saved</p>
    <button class="btn" onclick="document.getElementById('file-input').click()">Choose Files</button>
    <input type="file" id="file-input" accept=".dem" multiple />
  </div>

  <!-- Single-file progress -->
  <div id="progress-wrap">
    <p id="progress-label">Uploading…</p>
    <div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-fill"></div></div>
  </div>

  <!-- Multi-file queue -->
  <div id="queue-wrap">
    <div id="queue-header">
      <span id="queue-title">Uploading 0 files</span>
    </div>
    <div id="queue-list"></div>
    <div id="queue-summary">
      <p id="queue-summary-text"></p>
      <button class="btn btn-ghost" onclick="resetToUpload()">Upload More</button>
    </div>
  </div>

  <div id="error-banner"></div>

  <section id="history-section">
    <h2>Previous Demos</h2>
    <p id="history-empty">No demos saved yet.</p>
    <div id="history-list"></div>
  </section>
</main>

<script>
  const zone      = document.getElementById('upload-zone');
  const fileInput = document.getElementById('file-input');

  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
  zone.addEventListener('drop', e => {
    e.preventDefault();
    zone.classList.remove('drag-over');
    const files = [...e.dataTransfer.files].filter(f => f.name.toLowerCase().endsWith('.dem'));
    if (files.length) handleFiles(files);
    else showError('Only .dem files are supported.');
  });
  zone.addEventListener('click', e => { if (e.target.tagName !== 'BUTTON') fileInput.click(); });
  fileInput.addEventListener('change', () => {
    const files = [...fileInput.files].filter(f => f.name.toLowerCase().endsWith('.dem'));
    fileInput.value = '';
    if (files.length) handleFiles(files);
    else showError('Only .dem files are supported.');
  });

  // ── Entry point ───────────────────────────────────────────────
  function handleFiles(files) {
    hideError();
    if (files.length === 1) {
      uploadSingle(files[0]);
    } else {
      uploadQueue(files);
    }
  }

  // ── Single file: existing flow → redirect to viewer ───────────
  function uploadSingle(file) {
    zone.style.display = 'none';
    const progressWrap  = document.getElementById('progress-wrap');
    const progressLabel = document.getElementById('progress-label');
    const fill          = document.getElementById('progress-fill');
    progressWrap.style.display = 'block';
    progressLabel.textContent  = `Uploading ${file.name}…`;
    fill.style.width = '0%';

    const fd  = new FormData();
    fd.append('demo', file);
    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/parse');

    xhr.upload.onprogress = e => {
      if (e.lengthComputable) {
        const pct = Math.round(e.loaded / e.total * 100);
        fill.style.animation = 'none';
        fill.style.width = pct + '%';
        progressLabel.textContent = `Uploading… ${pct}%`;
      }
    };
    xhr.onload = () => {
      if (xhr.status === 200) {
        progressLabel.textContent = 'Parsing complete — loading viewer…';
        const data = JSON.parse(xhr.responseText);
        sessionStorage.setItem('demoData', JSON.stringify(data));
        window.location.href = '/viewer';
      } else {
        progressWrap.style.display = 'none';
        zone.style.display = '';
        let msg = 'Server error';
        try { msg = JSON.parse(xhr.responseText).error || msg; } catch {}
        showError(msg);
      }
    };
    xhr.onerror = () => {
      progressWrap.style.display = 'none';
      zone.style.display = '';
      showError('Network error — is the server running?');
    };
    progressLabel.textContent = `Parsing ${file.name} — this may take a moment…`;
    xhr.send(fd);
  }

  // ── Multi-file queue ──────────────────────────────────────────
  function uploadQueue(files) {
    zone.style.display = 'none';
    const queueWrap = document.getElementById('queue-wrap');
    const queueList = document.getElementById('queue-list');
    queueWrap.style.display = 'block';
    document.getElementById('queue-summary').style.display = 'none';
    document.getElementById('queue-title').textContent = `Uploading ${files.length} files`;

    // Build queue items
    queueList.innerHTML = '';
    files.forEach((f, i) => {
      const el = document.createElement('div');
      el.className = 'qi';
      el.id = `qi-${i}`;
      el.innerHTML = `
        <span class="qi-icon">⏳</span>
        <div style="flex:1;min-width:0">
          <div class="qi-name" title="${esc(f.name)}">${esc(f.name)}</div>
          <div class="qi-progress"><div class="qi-progress-fill" id="qf-${i}"></div></div>
        </div>
        <span class="qi-status">Queued</span>`;
      queueList.appendChild(el);
    });

    // Upload sequentially
    let done = 0, errors = 0;
    (async () => {
      for (let i = 0; i < files.length; i++) {
        await uploadQueueItem(files[i], i);
        const el = document.getElementById(`qi-${i}`);
        if (el.classList.contains('done')) done++;
        else errors++;
        document.getElementById('queue-title').textContent =
          `${i + 1} / ${files.length} processed`;
      }
      // All done
      const summary = document.getElementById('queue-summary');
      const text    = document.getElementById('queue-summary-text');
      text.textContent = errors === 0
        ? `All ${done} demo${done !== 1 ? 's' : ''} uploaded successfully.`
        : `${done} succeeded, ${errors} failed.`;
      summary.style.display = 'flex';
      document.getElementById('queue-title').textContent = 'Upload complete';
      loadHistory();
    })();
  }

  function uploadQueueItem(file, idx) {
    return new Promise(resolve => {
      const el     = document.getElementById(`qi-${idx}`);
      const fill   = document.getElementById(`qf-${idx}`);
      const status = el.querySelector('.qi-status');
      const icon   = el.querySelector('.qi-icon');

      el.classList.add('uploading');
      icon.textContent   = '🔄';
      status.textContent = 'Uploading…';

      const fd  = new FormData();
      fd.append('demo', file);
      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/parse');

      xhr.upload.onprogress = e => {
        if (e.lengthComputable) {
          const pct = Math.round(e.loaded / e.total * 100);
          fill.style.animation = 'none';
          fill.style.width = pct + '%';
          status.textContent = `Uploading ${pct}%`;
        }
      };
      xhr.onload = () => {
        el.classList.remove('uploading');
        if (xhr.status === 200) {
          el.classList.add('done');
          icon.textContent   = '✅';
          status.textContent = 'Done';
        } else {
          el.classList.add('error');
          icon.textContent = '❌';
          let msg = 'Error';
          try { msg = JSON.parse(xhr.responseText).error || msg; } catch {}
          status.textContent = msg;
        }
        resolve();
      };
      xhr.onerror = () => {
        el.classList.remove('uploading');
        el.classList.add('error');
        icon.textContent   = '❌';
        status.textContent = 'Network error';
        resolve();
      };
      status.textContent = `Parsing…`;
      xhr.send(fd);
    });
  }

  function resetToUpload() {
    document.getElementById('queue-wrap').style.display = 'none';
    zone.style.display = '';
    hideError();
  }

  // ── Helpers ───────────────────────────────────────────────────
  function showError(msg) {
    const el = document.getElementById('error-banner');
    el.textContent = '⚠ ' + msg;
    el.style.display = 'block';
  }
  function hideError() {
    document.getElementById('error-banner').style.display = 'none';
  }
  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Demo History ──────────────────────────────────────────────
  const historyList  = document.getElementById('history-list');
  const historyEmpty = document.getElementById('history-empty');

  function loadHistory() {
    fetch('/api/demos')
      .then(r => r.json())
      .then(demos => {
        historyList.innerHTML = '';
        if (!demos.length) { historyEmpty.style.display = 'block'; return; }
        historyEmpty.style.display = 'none';
        demos.forEach(d => {
          const ts      = new Date(d.uploaded_at);
          const dateStr = isNaN(ts) ? d.uploaded_at
            : ts.toLocaleString(undefined, {
                day: '2-digit', month: 'short', year: 'numeric',
                hour: '2-digit', minute: '2-digit'
              });
          const row = document.createElement('div');
          row.className = 'demo-row';
          row.innerHTML = `
            <div class="demo-name" title="${esc(d.filename)}">${esc(d.filename)}</div>
            <div class="demo-meta">${esc(d.map)} &nbsp;·&nbsp; ${dateStr}</div>
            <button class="demo-del" title="Delete" data-id="${d.id}">✕</button>`;
          row.addEventListener('click', e => {
            if (e.target.classList.contains('demo-del')) return;
            loadDemo(d.id, d.filename);
          });
          row.querySelector('.demo-del').addEventListener('click', e => {
            e.stopPropagation();
            deleteDemo(d.id, row);
          });
          historyList.appendChild(row);
        });
      })
      .catch(() => {});
  }

  function loadDemo(id, filename) {
    hideError();
    zone.style.display = 'none';
    const progressWrap  = document.getElementById('progress-wrap');
    const progressLabel = document.getElementById('progress-label');
    progressWrap.style.display = 'block';
    progressLabel.textContent  = `Loading ${filename}…`;
    fetch(`/api/demos/${id}`)
      .then(r => { if (!r.ok) throw new Error('Demo not found'); return r.json(); })
      .then(data => {
        sessionStorage.setItem('demoData', JSON.stringify(data));
        window.location.href = '/viewer';
      })
      .catch(err => {
        progressWrap.style.display = 'none';
        zone.style.display = '';
        showError(err.message || 'Failed to load demo');
      });
  }

  function deleteDemo(id, rowEl) {
    fetch(`/api/demos/${id}`, { method: 'DELETE' })
      .then(r => r.json())
      .then(() => {
        rowEl.remove();
        if (!historyList.children.length) historyEmpty.style.display = 'block';
      })
      .catch(() => showError('Failed to delete demo'));
  }

  loadHistory();
</script>
</body>
</html>
